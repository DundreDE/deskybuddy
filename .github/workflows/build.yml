name: Build installers

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist-script: dist:win
          - os: macos-latest
            dist-script: dist:mac
          - os: ubuntu-latest
            dist-script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Linux native build deps
        if: matrix.os == 'ubuntu-latest'
        # libuiohook (uiohook-napi's native addon) links against a wide swath of X11
        # extension headers — Xrandr/Xtst/Xinerama/Xi/Xext/Xt/XF86Misc/Xlib-xcb — none of
        # which ship on the runner by default, only their runtime .so counterparts.
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools \
            libx11-dev libxkbfile-dev libxtst-dev libxinerama-dev libxi-dev \
            libxrandr-dev libxext-dev libxt-dev libxxf86misc-dev libx11-xcb-dev
      - run: npm ci
      - run: npm run ${{ matrix.dist-script }}
      - uses: actions/upload-artifact@v4
        with:
          name: deskybuddy-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
      # Only attaches to a release when the workflow was triggered by publishing one —
      # a manual workflow_dispatch run still uploads the build-artifact above but skips this.
      - name: Attach installers to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          files=(dist/*.exe dist/*.dmg dist/*.zip dist/*.AppImage dist/*.deb)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installer files found to upload" >&2
            exit 1
          fi
          gh release upload "${{ github.event.release.tag_name }}" "${files[@]}" --clobber --repo "${{ github.repository }}"
